name: Windows installer

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Test
        run: go test ./...

      - name: Build Windows amd64
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-s -w" -o dist/shapez-auto.exe ./cmd/shapez-auto

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc installer\shapez-auto.iss

      - uses: actions/upload-artifact@v4
        with:
          name: shapez-auto-windows-amd64
          path: |
            dist/shapez-auto.exe
            dist/shapez-auto-windows-amd64-setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/shapez-auto-windows-amd64-setup.exe
          body: |
            Windows x64 安装包。安装后打开 shapez-auto，在页面里安装游戏模组，然后启动带模组的 Steam 版 shapez.io。
